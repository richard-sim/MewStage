# ------------------------------------------------------------------------------------------------- categories

[categories.core-bridge]
mandatory = true
description = "The MEWUI_MEWVG_MEWSTAGE branch of the MewVG IGraphicsContext bridge; the backend does not compile without it."

[categories.design-space]
mandatory = true
description = "A window frame drawn to a surface whose scale is below 1 lays out the whole design space (the Overlay HUD at 1280x720)."

[categories.multi-host]
mandatory = true
description = "Per-thread UI statics, graphics factory, animation manager and dispatcher: several hosts in one process (test suites, secondary windows), each pumping its own deferred work."

[categories.allocation]
mandatory = false
description = "A steady-state UI frame allocates nothing. Skipping it makes the frame allocate and the allocation gates fail, as expected."

[categories.text]
mandatory = false
description = "Letter spacing drawn per grapheme and a negative half-leading."

[categories.rendering]
mandatory = false
description = "Rectangle strokes keep antialiasing when the transform takes them off the pixel grid."

[categories.mewdock]
mandatory = false
description = "MewDock tool groups can hide their caption bar."

[categories.build]
mandatory = true
description = "The local-override hook in MewVG's build props, so the vendored MewVG builds net10.0 only."

# ------------------------------------------------------------------------------------------------- MewUI

# Repository root: license, notices and the build/ props + targets every project imports.
[components.mewui_build]
source = "mewui"
dest = "MewUI"
include = [
  "LICENSE", "THIRD_PARTY_NOTICES.md",
  "build/MewUI.Common.props", "build/Aprillz.MewUI.Core.targets",
  "build/MewUIPreview.targets", "build/MewUIPreviewInit.cs",
]
preserve = ["build/MewUI.Local.props"]

# The framework. Shared/** (platform hosts and rendering backends) is vendored whole: upstream's MewUI.csproj does
# <Compile Remove="Shared\**" /> and the platform / backend projects link the files they need.
[components.mewui]
source = "mewui"
src_root = "src/MewUI"
dest = "MewUI/src/MewUI"
preserve = ["MewStage.InternalsVisibleTo.cs", "packages.lock.json"]
patches = [
  { file = "patches/mewui/core-bridge/0001-mewvg-context-app-branch.patch", category = "core-bridge" },
  { file = "patches/mewui/allocation/0001-replay-text-without-delegate.patch", category = "allocation" },
  { file = "patches/mewui/allocation/0002-gradient-lut-identity-lookup.patch", category = "allocation" },
  { file = "patches/mewui/allocation/0003-resource-cache-evict-without-closure.patch", category = "allocation" },
  { file = "patches/mewui/allocation/0004-scene-pass-without-per-frame-allocation.patch", category = "allocation" },
  { file = "patches/mewui/design-space/0001-surface-scale-below-one.patch", category = "design-space" },
  { file = "patches/mewui/text/0001-letter-spacing-draws-per-grapheme.patch", category = "text" },
  { file = "patches/mewui/text/0002-negative-half-leading.patch", category = "text" },
  { file = "patches/mewui/rendering/0001-rect-stroke-antialias-off-axis.patch", category = "rendering" },
  { file = "patches/mewui/allocation/0005-apply-template-without-per-call-closure.patch", category = "allocation" },
  { file = "patches/mewui/allocation/0006-dashed-stroke-without-per-draw-allocation.patch", category = "allocation" },
  { file = "patches/mewui/multi-host/0001-per-thread-ui-statics-and-graphics-factory.patch", category = "multi-host" },
  { file = "patches/mewui/multi-host/0002-per-thread-animation-manager.patch", category = "multi-host" },
  { file = "patches/mewui/multi-host/0003-per-thread-dispatcher.patch", category = "multi-host" },
]

[components.analyzers]
source = "mewui"
src_root = "src/MewUI.Analyzers"
dest = "MewUI/src/MewUI.Analyzers"
preserve = ["packages.lock.json"]

[components.generators]
source = "mewui"
src_root = "src/MewUI.Generators"
dest = "MewUI/src/MewUI.Generators"
preserve = ["packages.lock.json"]

[components.preview]
source = "mewui"
src_root = "src/MewUI.Preview"
dest = "MewUI/src/MewUI.Preview"
preserve = ["packages.lock.json"]

# Standard platform hosts + MewVG (OpenGL) backends: Kit mode runs on them; the embedded modes do not use them.
[components.platform_win32]
source = "mewui"
src_root = "src/MewUI.Platform.Win32"
dest = "MewUI/src/MewUI.Platform.Win32"
preserve = ["packages.lock.json"]

[components.platform_x11]
source = "mewui"
src_root = "src/MewUI.Platform.X11"
dest = "MewUI/src/MewUI.Platform.X11"
preserve = ["packages.lock.json"]

[components.backend_mewvg_win32]
source = "mewui"
src_root = "src/MewUI.Backend.MewVG.Win32"
dest = "MewUI/src/MewUI.Backend.MewVG.Win32"
preserve = ["packages.lock.json"]

[components.backend_mewvg_x11]
source = "mewui"
src_root = "src/MewUI.Backend.MewVG.X11"
dest = "MewUI/src/MewUI.Backend.MewVG.X11"
preserve = ["packages.lock.json"]

[components.mewdock]
source = "mewui"
src_root = "extensions/MewUI.MewDock"
dest = "MewUI/extensions/MewUI.MewDock"
preserve = ["packages.lock.json"]
patches = [
  { file = "patches/mewui/mewdock/0001-tool-caption-toggle.patch", category = "mewdock" },
]

# SVG: MewStage keeps its own csproj, which compiles the COMMITTED generated registry (Generated/) instead of running
# SvgNet's source generator at build time (no build-time Roslyn component; AOT output equals JIT output). Upstream's
# .gitignore is excluded because it ignores that folder.
[components.svg]
source = "mewui"
src_root = "extensions/MewUI.Svg"
dest = "MewUI/extensions/MewUI.Svg"
exclude = ["MewUI.Svg.csproj", ".gitignore", "ThirdParty/**"]
preserve = ["MewUI.Svg.csproj", "Generated/**", "packages.lock.json"]

[components.svgnet]
source = "svgnet"
dest = "MewUI/extensions/MewUI.Svg/ThirdParty/SvgNet"
include = ["Source/**", "Generators/**", "license.txt"]

[components.geometry]
source = "mewui"
src_root = "extensions/MewUI.Geometry"
dest = "MewUI/extensions/MewUI.Geometry"
exclude = ["ThirdParty/**"]
preserve = ["packages.lock.json"]

[components.clipper2]
source = "clipper2"
dest = "MewUI/extensions/MewUI.Geometry/ThirdParty/Clipper2"
include = ["CSharp/Clipper2Lib/*.cs", "LICENSE"]

# MewCharts: LiveChartsCore compiled into the extension's own assembly (upstream's design); the engine and its source
# generator come from the pinned LiveCharts2 submodule commit. ThirdParty/Directory.Build.targets is upstream MewUI's
# (it silences the generator's doc warnings), so only the submodule folder itself is excluded here.
[components.mewcharts]
source = "mewui"
src_root = "extensions/MewUI.MewCharts"
dest = "MewUI/extensions/MewUI.MewCharts"
exclude = ["ThirdParty/LiveCharts2/**"]
preserve = ["packages.lock.json"]

[components.livecharts2]
source = "livecharts2"
dest = "MewUI/extensions/MewUI.MewCharts/ThirdParty/LiveCharts2"
include = ["src/LiveChartsCore/**", "generators/**", "nuget.props", "LICENSE"]
exclude = ["generators/LiveChartsGenerators/Properties/launchSettings.json"]
preserve = ["generators/LiveChartsGenerators/packages.lock.json"]

# ------------------------------------------------------------------------------------------------- MewVG

[components.mewvg_build]
source = "mewvg"
dest = "MewVG"
include = ["LICENSE", "build/MewVG.Common.props"]
preserve = ["build/MewVG.Local.props"]
patches = [
  { file = "patches/mewvg/build/0001-common-props-local-hook.patch", category = "build" },
]

[components.mewvg]
source = "mewvg"
src_root = "src/MewVG.Core"
dest = "MewVG/src/MewVG.Core"
preserve = ["MewStage.InternalsVisibleTo.cs", "packages.lock.json"]
patches = [
  { file = "patches/mewvg/allocation/0001-scratch-pool-not-trimmed.patch", category = "allocation" },
]

# The OpenGL renderer: the MewVG backends Kit mode runs on need it; it is also the reference the NanoVG port mirrors.
[components.mewvg_gl]
source = "mewvg"
src_root = "src/MewVG.GL"
dest = "MewVG/src/MewVG.GL"
preserve = ["packages.lock.json"]
