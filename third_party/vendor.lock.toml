# vendor.lock.toml - the single source of provenance for MewStage's vendored MewUI / MewVG (+ extensions).
#
# Re-vendor:      python third_party/tools/vendor.py                  (writes the tree; every patch applied)
# Verify:         python third_party/tools/vendor.py --check          (exit 1 on drift from the lock + the recorded patch set)
# List patches:   python third_party/tools/vendor.py --list-patches
# Fewer patches:  python third_party/tools/vendor.py --skip-category allocation,text   (mandatory categories never skip)
#
# [sources.*]     one upstream COMMIT each (never a branch or a tag: tags move, main churns). The codeload tarball of
#                 that commit is verified by archive_sha256 and, authoritatively, by content_sha256 (sha256 over every
#                 "F <path> <file sha256>" line, sorted; see Source.content_digest in the script). Git submodules are
#                 their own sources, pinned to the commit the parent repository records.
# [categories.*]  the patch categories (docs/vendoring.md). A mandatory category cannot be skipped: the backend does
#                 not compile without it, or the test suites cannot run.
# [components.*]  one upstream folder -> one third_party folder. Paths are relative to third_party/. include / exclude
#                 are globs on the path below src_root. preserve globs are MewStage-authored files inside dest that
#                 the updater never writes or deletes. patches apply in list order, -p1 relative to dest, by the
#                 script's strict in-memory applier; each names its category. A component whose dest lies inside
#                 another's dest owns that folder (the outer component never touches it).
#
# Layout: third_party/MewUI and third_party/MewVG mirror the upstream REPOSITORY layout (build/, src/<proj>/,
# extensions/<proj>/), so upstream csprojs, their relative links into src/MewUI/Shared/ and the build/ props all work
# unmodified. MewStage hooks in only through upstream's own build/MewUI.Local.props and (by the mewvg/build patch) the
# same hook in MewVG's build/MewVG.Common.props. See third_party/NOTICE and docs/vendoring.md.

[meta]
order = [
  "mewui_build", "mewui", "analyzers", "generators", "preview",
  "platform_win32", "platform_x11", "backend_mewvg_win32", "backend_mewvg_x11",
  "mewdock", "svg", "svgnet", "geometry", "clipper2", "mewcharts", "livecharts2",
  "mewvg_build", "mewvg", "mewvg_gl",
]

